<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Atendimento Virtual</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-indigo-50/40 to-slate-200 text-gray-800 min-h-screen flex items-center justify-center p-0 sm:p-4">

  <!-- Chat Container -->
  <div class="w-full sm:max-w-md md:max-w-lg h-[100dvh] sm:h-[88vh] sm:max-h-[820px] bg-white sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-gray-200/80 relative">
    
    <!-- Top Header -->
    <header class="bg-white/90 backdrop-blur-md px-5 py-4 border-b border-gray-100 flex items-center justify-between z-10 shadow-xs">
      <div class="flex items-center gap-3">
        <div class="relative">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=VirtualBot" alt="Avatar" class="bot-avatar-img w-11 h-11 rounded-full p-0.5 bg-indigo-50 border border-indigo-100 shadow-sm object-cover">
          <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 rounded-full border-2 border-white pulse-dot"></span>
        </div>
        <div>
          <h1 class="bot-name-text font-bold text-gray-900 text-base leading-tight">Assistente Virtual</h1>
          <p class="bot-subtitle-text text-xs text-gray-500 flex items-center gap-1.5 font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Online agora
          </p>
        </div>
      </div>

    </header>

    <!-- Messages Container -->
    <main id="chat-messages" class="flex-1 overflow-y-auto p-4 sm:p-5 space-y-2 bg-gradient-to-b from-gray-50/50 via-white to-gray-50/30">
      <!-- Bubbles injected dynamically via chat-engine.js -->
    </main>

    <!-- Bottom Input Bar -->
    <footer id="input-area" class="p-3 sm:p-4 bg-white border-t border-gray-100 hidden">
      <form id="input-form" class="flex items-center gap-2">
        <input 
          type="text" 
          id="chat-input" 
          autocomplete="off"
          class="flex-1 bg-gray-50 border border-gray-200 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-100 rounded-full px-5 py-3 text-sm md:text-base outline-none transition-all placeholder-gray-400"
          placeholder="Digite sua resposta..."
        >
        <button 
          type="submit" 
          id="send-btn" 
          class="btn-primary-bg bg-indigo-600 hover:bg-indigo-700 text-white rounded-full p-3 shadow-md hover:shadow-indigo-500/25 transition-all duration-200 focus:outline-none transform active:scale-95 flex items-center justify-center flex-shrink-0"
        >
          <svg class="w-5 h-5 translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
        </button>
      </form>
    </footer>

    <!-- Watermark / Footer signature -->
    <div class="bg-gray-50/80 border-t border-gray-100/60 py-1.5 text-center text-[11px] text-gray-400 font-medium">
      ⚡ Criado com <span class="font-semibold text-gray-600">Typebot Custom</span>
    </div>

  </div>

  <!-- Modal de Zoom de Imagem (na mesma tela, sem sair nem resetar) -->
  <div id="image-lightbox" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-3 sm:p-6 cursor-pointer" onclick="closeLightbox()">
    <button class="absolute top-4 right-4 text-white/80 hover:text-white bg-black/50 hover:bg-black/70 rounded-full p-2.5 transition-colors focus:outline-none z-10" onclick="closeLightbox()">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <div class="relative max-w-full max-h-[92vh] flex flex-col items-center justify-center" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="Imagem ampliada" class="max-w-full max-h-[85vh] rounded-2xl shadow-2xl object-contain border border-white/10 animate-pop-in">
      <div class="text-xs text-white/70 mt-3 font-medium bg-black/40 px-3 py-1 rounded-full">Toque fora para voltar ao chat</div>
    </div>
  </div>

  <script src="/js/chat-engine.js"></script>
</body>
</html>
